<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fd312e">
<meta name="description" content="LG Subscribe MiniApp — bản xem trước thiết kế dành cho điện thoại.">
<title>LG Subscribe · MiniApp</title>
<style>@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url('assets/montserrat-400.woff') format('woff')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url('assets/montserrat-500.woff') format('woff')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url('assets/montserrat-600.woff') format('woff')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url('assets/montserrat-700.woff') format('woff')}

/* LG showroom — mobile MiniApp, Montserrat throughout. */
:root {
  --active: #fd312e;
  --heritage: #fd312e;
  --warm: #f0ece4;
  --white: #fff;
  --black: #000;
  --ink: #242424;
  --muted: #68645f;
  --line: #e7e3dd;
  --soft: #f7f5f2;
  --red-soft: #fff0f1;
  --display: 'Montserrat', Arial, sans-serif;
  --body: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  --header-height: calc(60px + env(safe-area-inset-top));
  --press-duration: 120ms;
  --state-duration: 180ms;
}

* {
  box-sizing: border-box
}

html {
  scroll-behavior: auto;
  scroll-padding-top: 80px
}

body {
  margin: 0;
  background: var(--warm);
  color: var(--ink);
  font: 14px/1.55 var(--body);
  -webkit-font-smoothing: antialiased
}

button,
input,
select,
textarea {
  font: inherit
}

button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation
}

button {
  cursor: pointer;
  color: inherit;
  border: 0;
  background: transparent;
  transition: background var(--state-duration), color var(--state-duration), opacity var(--press-duration)
}

button:active {
  opacity: .72
}

button:disabled {
  opacity: .4;
  cursor: default
}

a {
  color: var(--heritage)
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--heritage);
  outline-offset: 3px
}

img {
  max-width: 100%;
  display: block
}

h1,
h2,
h3,
p {
  margin: 0
}

h1,
h2,
h3 {
  font-family: var(--display);
  letter-spacing: -.65px;
  text-wrap: balance
}

h1 {
  font-size: 27px;
  line-height: 1.3;
  font-weight: 700
}

h2 {
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600
}

h3 {
  font-size: 16px;
  line-height: 1.45;
  font-weight: 600
}

svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round
}

small {
  font-size: 12px
}

.app {
  width: 100%;
  max-width: 480px;
  min-height: 100dvh;
  margin: auto;
  background: var(--white);
  position: relative;
  box-shadow: 0 0 60px #00000008
}

.screen {
  padding-bottom: calc(100px + env(safe-area-inset-bottom));
  min-height: calc(100dvh - var(--header-height))
}

.screen.has-dock {
  padding-bottom: 124px
}

.pad {
  padding: 0 20px
}

.spaced {
  padding: 24px 20px
}

.header {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--header-height);
  padding: 8px 20px;
  padding-top: calc(8px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--white);
  border-bottom: 1px solid var(--line)
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0
}

.brand img {
  width: 55px;
  height: auto
}

.brand-name {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.7px;
  border-left: 1px solid var(--line);
  padding-left: 10px
}

.header-actions {
  display: flex;
  gap: 4px
}

.icon-button {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative
}

.icon-button:hover {
  background: var(--soft)
}

.counter {
  position: absolute;
  right: 0;
  top: 1px;
  background: var(--heritage);
  color: var(--white);
  border-radius: 20px;
  min-width: 18px;
  height: 18px;
  font-size: 10px;
  line-height: 18px;
  text-align: center
}

.eyebrow,
.section-kicker {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.15px;
  text-transform: uppercase
}

.section-kicker {
  color: var(--heritage);
  margin-bottom: 6px
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px
}

.section-heading h2 {
  font-size: 22px
}

.text-button {
  font-size: 12px;
  min-height: 44px;
  color: var(--heritage);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  flex-shrink: 0
}

.text-button svg {
  width: 17px;
  height: 17px
}

/* Campaigns: one message, one appliance, one action. */
.hero-wrap {
  padding: 0
}

.hero {
  min-height: 370px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: var(--warm);
  color: var(--ink)
}

.hero-content {
  position: relative;
  padding: 28px 24px 32px;
  z-index: 3;
  width: 100%
}

.hero .eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--heritage)
}

.brand-mark {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--active)
}

.hero h1 {
  font-size: 32px;
  line-height: 1.16;
  letter-spacing: -1.25px;
  margin: 20px 0 18px;
  max-width: 330px;
  font-weight: 600
}

.hero-desc {
  font-size: 12px;
  line-height: 1.5;
  max-width: 180px;
  color: var(--muted);
  margin-bottom: 5px
}

.hero-price {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.85px;
  line-height: 1.4;
  width: max-content;
  max-width: 56%;
  color: var(--heritage)
}

.hero-price small {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--ink)
}

.hero-price small:last-child {
  display: block;
  margin-top: 1px
}

.hero-cta {
  margin-top: 19px;
  min-height: 48px;
  width: max-content;
  max-width: 60%;
  padding: 11px 14px;
  border-radius: 8px;
  background: var(--heritage);
  color: var(--white);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left
}

.hero-cta svg {
  width: 17px;
  height: 17px
}

.hero-term {
  display: block;
  margin-top: 7px;
  font-size: 10px;
  color: var(--muted)
}

.hero-scene {
  position: absolute;
  right: 9px;
  bottom: 38px;
  width: 43%;
  height: 194px;
  z-index: 1;
  mix-blend-mode: multiply
}

.hero-stage {
  position: absolute;
  inset: 45px -30px -3px 7px;
  background: #e3ddd2;
  border-radius: 70px 0 0 0
}

.hero-stage::after {
  content: '';
  position: absolute;
  left: -10px;
  right: 0;
  bottom: 0;
  height: 33px;
  background: #d5cdc1;
  transform: skewY(-5deg);
  transform-origin: right
}

.hero-scene img {
  position: absolute;
  object-fit: contain;
  width: 100%;
  height: 174px;
  right: 4px;
  bottom: 15px;
  mix-blend-mode: multiply;
  filter: drop-shadow(0 8px 7px #00000018)
}

.hero-product-label {
  position: absolute;
  right: 0;
  bottom: -20px;
  font-size: 10px;
  letter-spacing: .3px;
  color: var(--muted);
  font-weight: 500;
  text-align: right
}

.hero-signature {
  position: absolute;
  right: 23px;
  top: 28px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -.25px;
  opacity: .6;
  display: none
}

.hero.promo-tv {
  background: var(--heritage);
  color: var(--white)
}

.promo-tv .hero-desc,
.promo-tv .hero .eyebrow,
.promo-tv .hero-term {
  color: #f7dfe7
}

.promo-tv .eyebrow,
.promo-tv .hero-price,
.promo-tv .hero-price small {
  color: var(--white)
}

.promo-tv .hero-cta {
  background: var(--white);
  color: var(--heritage)
}

.promo-tv .hero-stage {
  background: #d9c1bd;
  inset: 72px -35px -3px 0;
  border-radius: 0
}

.promo-tv .hero-stage::after {
  background: #c5a8a0
}

.promo-tv .hero-scene {
  right: 0;
  width: 45%;
  height: 180px;
  mix-blend-mode: normal;
  background: var(--heritage)
}

.promo-tv .hero-scene img {
  height: 155px;
  bottom: 14px;
  right: 0;
  mix-blend-mode: normal;
  clip-path: inset(20% 0 20% 0)
}

.promo-tv .hero-product-label {
  right: 16px;
  color: #f7dfe7
}

.hero.promo-air {
  background: #e6e0d6;
  color: var(--ink)
}

.promo-air .hero-desc,
.promo-air .hero-term {
  color: var(--muted)
}

.promo-air .eyebrow {
  color: var(--heritage)
}

.promo-air .hero-price {
  color: var(--heritage)
}

.promo-air .hero-price small {
  color: var(--ink)
}

.promo-air .hero-cta {
  background: var(--heritage);
  color: var(--white)
}

.promo-air .hero-scene {
  mix-blend-mode: multiply;
  background: transparent
}

.promo-air .hero-stage {
  background: #e0d9cc
}

.promo-air .hero-stage::after {
  background: #c8bfad
}

.promo-air .hero-product-label {
  color: var(--muted)
}

.hero-wrap {
  position: relative
}

.pagination {
  position: absolute;
  left: 12px;
  bottom: 62px;
  z-index: 4;
  display: flex;
  gap: 0
}

.subscribe-ribbon {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  padding: 0 20px;
  background: var(--heritage);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  text-align: left
}

.subscribe-ribbon .ribbon-sub {
  flex: 1;
  min-width: 0;
  font-size: 10px;
  font-weight: 500;
  opacity: .85;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.subscribe-ribbon svg {
  width: 17px;
  height: 17px;
  margin-left: auto;
  flex: none
}

.dot-button {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center
}

.dot-button span {
  height: 4px;
  width: 14px;
  background: #b9b4ad;
  border-radius: 0;
  transition: background var(--state-duration), width var(--state-duration)
}

.dot-button[aria-pressed=true] span {
  width: 28px;
  background: var(--heritage)
}

/* Product types are the customer-facing entry points. */
.category-home {
  padding: 28px 20px 30px
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px 8px
}

.category-tile {
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 0;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  text-align: center;
  min-width: 0
}

.category-visual {
  height: 58px;
  width: 65px;
  display: grid;
  place-items: center;
  background: transparent;
  border-radius: 0
}

.category-visual img {
  height: 56px;
  width: 58px;
  object-fit: contain
}

.category-visual.ac img {
  width: 63px;
  height: 48px
}

.category-visual.tv img {
  width: 63px;
  height: 50px
}

.category-visual.all {
  color: var(--heritage)
}

.category-visual.all svg {
  width: 29px;
  height: 29px
}

.campaign-small {
  position: relative;
  background: var(--ink);
  color: var(--white);
  overflow: hidden;
  padding: 26px 24px;
  min-height: 224px;
  margin: 0 0 32px;
  isolation: isolate
}

.campaign-small-copy {
  position: relative;
  z-index: 2;
  max-width: 70%
}

.campaign-small h2 {
  font-size: 25px;
  line-height: 1.25;
  margin: 12px 0 8px;
  font-weight: 600;
  letter-spacing: -.8px
}

.campaign-small .eyebrow {
  color: #e5d7cc;
  font-size: 9px
}

.campaign-small p {
  font-size: 12px;
  color: #ddd7ce
}

.campaign-small .text-button {
  color: var(--white);
  margin-top: 12px;
  font-size: 11px
}

.small-stage {
  mix-blend-mode: normal;
  position: absolute;
  right: -24px;
  bottom: 0;
  width: 35%;
  height: 178px;
  background: #ede4d6;
  border-radius: 60px 0 0 0;
  z-index: 1
}

.small-stage img {
  position: absolute;
  right: 27px;
  width: 105px;
  height: 164px;
  bottom: 11px;
  object-fit: contain;
  mix-blend-mode: multiply
}

.featured {
  padding: 0 20px 32px
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px
}

.product-card {
  min-width: 0;
  position: relative
}

.product-visual {
  position: relative;
  background: var(--soft);
  border-radius: 8px;
  aspect-ratio: 1/1.15;
  overflow: hidden
}

.product-open {
  padding: 22px 12px 16px;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center
}

.product-open img {
  width: 92%;
  height: 92%;
  object-fit: contain;
  mix-blend-mode: multiply;
  transition: transform var(--state-duration)
}

.product-open:hover img {
  transform: scale(1.035)
}

.product-tag {
  position: absolute;
  left: 10px;
  top: 10px;
  font-size: 11px;
  font-weight: 500;
  z-index: 1;
  pointer-events: none;
  max-width: calc(100% - 20px);
  overflow-wrap: anywhere
}

.heart-button {
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--muted);
  border-radius: 50%
}

.heart-button[aria-pressed=true] {
  color: var(--heritage)
}

.heart-button[aria-pressed=true] svg {
  fill: var(--heritage)
}

.image-disclaimer {
  position: absolute;
  left: 10px;
  bottom: 8px;
  color: var(--muted);
  font-size: 9px;
  max-width: calc(100% - 52px);
  pointer-events: none
}

.product-copy {
  width: 100%;
  text-align: left;
  padding: 12px 0 0;
  display: block
}

.product-copy h3 {
  font-size: 14px;
  line-height: 1.45;
  letter-spacing: -.35px;
  min-height: 41px;
  font-weight: 600;
  text-wrap: initial
}

.product-spec {
  font-size: 11px;
  color: var(--muted);
  margin: 6px 0 3px
}

.product-copy .model {
  font-size: 10px;
  color: var(--muted);
  overflow-wrap: anywhere;
  letter-spacing: .2px
}

.price {
  font-size: 21px;
  font-weight: 700;
  color: var(--heritage);
  letter-spacing: -.65px;
  line-height: 1.35;
  font-variant-numeric: tabular-nums
}

.price small {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--muted)
}

.card-price-label {
  font-size: 11px;
  color: var(--muted);
  margin: 13px 0 2px
}

.term-note {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.6
}

.card-link {
  width: 100%;
  padding: 0;
  text-align: left;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink);
  min-height: 44px;
  border-top: 1px solid var(--line);
  margin-top: 12px
}

.card-link svg {
  width: 17px;
  height: 17px;
  color: var(--heritage)
}

.availability-label {
  font-size: 11px;
  color: var(--heritage);
  margin-top: 7px
}

.benefits {
  margin: 0 0 24px;
  padding: 28px 24px 20px;
  background: var(--warm)
}

.benefits h2 {
  max-width: 300px;
  font-size: 25px;
  font-weight: 600
}

.benefit-grid {
  display: grid;
  margin: 24px 0 10px;
  gap: 0
}

.benefit-grid>div {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 0;
  border-top: 1px solid #d8d1c6
}

.benefit-number {
  font-size: 12px;
  color: var(--heritage);
  align-self: flex-start;
  padding-top: 2px
}

.benefit-grid h3 {
  font-size: 14px;
  letter-spacing: -.25px
}

.benefit-grid p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px
}

.benefit-grid svg {
  color: var(--heritage);
  margin-left: auto;
  width: 22px
}

.footnote {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
  padding: 0 20px 16px
}

.footnote a {
  font-size: inherit
}

/* Compact, phone-first browse controls. */
.page-top {
  padding: 22px 20px 16px
}

.page-top p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 6px
}

.back-heading {
  display: flex;
  align-items: center;
  gap: 6px
}

.back-heading .icon-button {
  margin-left: -10px
}

.back-heading h1 {
  font-size: 21px
}

.catalog-screen .page-top {
  padding-top: 20px;
  padding-bottom: 16px
}

.catalog-screen .page-top h1 {
  font-size: 26px
}

.catalog-search {
  display: flex;
  align-items: center;
  margin: 0 20px 12px;
  background: var(--soft);
  border: 1px solid var(--line);
  padding: 0 12px;
  border-radius: 8px;
  height: 48px;
  gap: 10px
}

.catalog-search input {
  border: 0;
  background: transparent;
  width: 100%;
  min-width: 0;
  font-size: 16px;
  height: 100%;
  color: var(--ink)
}

.catalog-search input::placeholder {
  font-size: 10px
}

.catalog-search input:focus-visible {
  outline: none
}

.catalog-search:focus-within {
  border-color: var(--heritage);
  background: var(--white)
}

.catalog-search svg {
  width: 20px;
  color: var(--muted)
}

.catalog-toolbar {
  position: sticky;
  top: var(--header-height);
  z-index: 12;
  background: var(--white);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line)
}

.category-switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  font-weight: 600;
  min-width: 0;
  flex: 1;
  min-height: 44px;
  padding: 8px 0;
  text-align: left
}

.category-switch span {
  min-width: 0;
  overflow-wrap: anywhere
}

.category-switch svg {
  width: 16px;
  height: 16px;
  transform: rotate(90deg)
}

.toolbar-button {
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  background: var(--white);
  flex-shrink: 0
}

.toolbar-button svg {
  width: 18px;
  height: 18px
}

.filter-count {
  border-radius: 50%;
  background: var(--heritage);
  color: var(--white);
  font-size: 10px;
  min-width: 18px;
  line-height: 18px;
  text-align: center
}

.sort-select {
  min-width: 0;
  border: 0;
  padding: 8px 0 8px 8px;
  color: var(--ink);
  background: var(--white);
  font-size: 12px;
  max-width: 160px;
  min-height: 44px
}

.results-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 20px 10px;
  font-size: 12px;
  color: var(--muted)
}

.results-line strong {
  color: var(--ink);
  font-weight: 500
}

.active-filters {
  padding: 12px 20px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px
}

.active-filters:empty {
  display: none
}

.active-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  background: var(--red-soft);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 11px;
  color: var(--heritage);
  text-align: left
}

.active-filter svg {
  width: 14px;
  height: 14px
}

.catalog-products {
  padding: 0 20px 24px
}

.empty {
  padding: 40px 16px;
  text-align: center
}

.empty-icon {
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin: 0 auto 17px;
  background: var(--warm);
  color: var(--heritage);
  border-radius: 50%
}

.empty-icon svg {
  width: 30px;
  height: 30px
}

.empty h2 {
  font-size: 21px;
  margin-bottom: 8px
}

.empty p {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 20px
}

.category-sheet-intro {
  font-size: 13px;
  color: var(--muted);
  margin: 6px 0 20px;
  line-height: 1.7
}

.category-picker-grid {
  display: grid;
  gap: 8px
}

.category-pick {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 72px;
  padding: 10px 12px;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500
}

.category-pick.selected {
  border-color: var(--heritage);
  color: var(--heritage);
  background: var(--red-soft)
}

.category-pick-image {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--heritage)
}

.category-pick-image img {
  width: 44px;
  height: 44px;
  object-fit: contain;
  mix-blend-mode: multiply
}

.category-pick>span:nth-child(2) {
  flex: 1;
  min-width: 0
}

.category-pick small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
  margin-top: 3px
}

.category-pick>svg {
  width: 16px;
  color: var(--muted)
}

/* Bottom navigation retains predictable, thumb-friendly destinations. */
.nav {
  position: fixed;
  z-index: 25;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  max-width: 480px;
  width: 100%;
  background: var(--white);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  min-height: calc(74px + env(safe-area-inset-bottom))
}

.nav-button {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  padding-top: 6px;
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  min-height: 56px;
  line-height: 1.4
}

.nav-button svg {
  width: 22px;
  height: 22px;
  margin-top: 3px;
  position: relative;
  z-index: 1
}

.nav-button[aria-current=page] {
  color: var(--heritage);
  font-weight: 600
}

.nav-button[aria-current=page]::before {
  content: '';
  width: 52px;
  height: 28px;
  border-radius: 14px;
  background: var(--red-soft);
  position: absolute;
  top: 6px
}

/* Flow foundations */
.primary {
  background: var(--heritage);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 50px;
  padding: 12px 18px;
  border-radius: 14px;
  font-weight: 600;
  font-size: 14px;
  width: 100%
}

.primary:hover {
  background: #d9201d
}

.secondary {
  border: 1px solid var(--line);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 11px 16px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600
}

.detail-visual {
  position: relative;
  margin: 0 16px;
  background: var(--soft);
  border-radius: 24px;
  padding: 20px 16px 10px
}

.detail-visual>.heart-button {
  top: 8px;
  bottom: auto;
  right: 8px
}

.detail-main-image {
  height: 241px;
  width: 100%;
  object-fit: contain;
  mix-blend-mode: multiply
}

.gallery-strip {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 14px 0 1px
}

.gallery-button {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  height: 48px;
  width: 48px;
  padding: 5px
}

.gallery-button[aria-pressed=true] {
  border-color: var(--heritage);
  box-shadow: 0 0 0 1px var(--heritage)
}

.gallery-button img {
  height: 100%;
  width: 100%;
  object-fit: contain
}

.detail-copy {
  padding: 20px
}

.detail-copy .model {
  font-size: 11px;
  color: var(--muted);
  margin: 3px 0 8px;
  letter-spacing: .6px
}

.detail-copy h1 {
  font-size: 23px;
  line-height: 1.45;
  margin-bottom: 11px
}

.spec-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap
}

.spec-pills span {
  background: var(--soft);
  border-radius: 7px;
  padding: 5px 8px;
  font-size: 11px
}

.plan-section {
  padding: 0 20px 24px
}

.plan-section .section-heading {
  margin-bottom: 12px
}

.plan-section .section-heading h2 {
  font-size: 18px
}

.segmented {
  display: flex;
  background: var(--soft);
  padding: 4px;
  border-radius: 13px;
  margin-bottom: 16px
}

.segmented button {
  min-height: 44px;
  flex: 1;
  font-size: 13px;
  border-radius: 10px
}

.segmented button[aria-pressed=true] {
  background: #fff;
  box-shadow: 0 2px 8px #0000000c;
  font-weight: 600;
  color: var(--heritage)
}

.term-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px
}

.term-option {
  border: 1px solid var(--line);
  border-radius: 14px;
  min-height: 86px;
  padding: 11px 4px;
  position: relative;
  text-align: center
}

.term-option strong {
  display: block;
  font-size: 13px;
  font-weight: 600
}

.term-option span {
  display: block;
  font-size: 11px;
  margin-top: 5px;
  color: var(--muted)
}

.term-option[aria-pressed=true] {
  border-color: var(--heritage);
  box-shadow: 0 0 0 1px var(--heritage);
  background: #fff6f6
}

.term-option[aria-pressed=true] strong,
.term-option[aria-pressed=true] span {
  color: var(--heritage)
}

.plan-summary {
  margin-top: 15px;
  border-radius: 15px;
  background: var(--soft);
  padding: 16px
}

.summary-top {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 10px
}

.summary-top .price {
  font-size: 28px;
  line-height: 1.3
}

.summary-top .price small {
  font-size: 11px;
  display: block;
  margin-top: 3px
}

.summary-top>span {
  font-size: 11px;
  color: var(--muted);
  text-align: right
}

.cost-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  margin-top: 11px
}

.cost-row strong {
  font-weight: 600;
  text-align: right
}

.plan-summary hr {
  margin: 13px 0 0;
  border: 0;
  border-top: 1px solid #e0dcd5
}

.service-card {
  margin: 0 20px 22px;
  border-top: 1px solid var(--line);
  padding-top: 20px
}

.service-card h2 {
  font-size: 18px;
  margin-bottom: 14px
}

.feature-row {
  display: flex;
  gap: 12px;
  margin-top: 13px
}

.feature-row svg {
  width: 22px;
  color: var(--heritage);
  margin-top: 2px
}

.feature-row h3 {
  font-size: 13px
}

.feature-row p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px
}

.accordion {
  margin: 0 20px 22px;
  border-top: 1px solid var(--line)
}

.accordion details {
  border-bottom: 1px solid var(--line)
}

.accordion summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 56px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  list-style: none
}

.accordion summary::-webkit-details-marker {
  display: none
}

.accordion summary:after {
  content: '+';
  font-size: 22px;
  font-weight: 400
}

.accordion details[open] summary:after {
  content: '−'
}

.accordion .answer {
  padding: 0 0 18px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8
}

.spec-table {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse
}

.spec-table td {
  padding: 9px 0;
  border-top: 1px solid var(--line)
}

.spec-table td:first-child {
  color: var(--muted);
  width: 42%
}

.dock {
  position: fixed;
  z-index: 24;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #fffffff8;
  border-top: 1px solid var(--line);
  backdrop-filter: blur(16px);
  padding: 12px 20px max(15px, env(safe-area-inset-bottom));
  display: flex;
  gap: 15px;
  align-items: center;
  min-height: 92px
}

.dock .dock-price {
  min-width: 115px
}

.dock .dock-price .price {
  font-size: 20px
}

.dock .dock-price small {
  font-size: 10px;
  color: var(--muted)
}

.dock .primary {
  flex: 1;
  font-size: 13px;
  min-height: 50px
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #0007;
  display: flex;
  align-items: end;
  justify-content: center;
  backdrop-filter: blur(2px)
}

.overlay[hidden] {
  display: none
}

.sheet {
  max-width: 480px;
  width: 100%;
  max-height: 88dvh;
  overflow: auto;
  background: #fff;
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -10px 50px #0002;
  animation: slide-up .2s ease-out;
  overscroll-behavior: contain;
  padding-bottom: env(safe-area-inset-bottom)
}

.sheet-handle {
  height: 4px;
  width: 35px;
  background: #dad6d0;
  margin: 10px auto 0;
  border-radius: 4px
}

.sheet-heading {
  padding: 8px 20px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1
}

.sheet-heading h2 {
  font-size: 19px
}

.sheet-content {
  padding: 0 20px 24px
}

.sheet-content .label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin: 18px 0 11px
}

.sheet-content .sub-label {
  font-size: 11px;
  color: var(--muted);
  margin: 0 0 12px
}

.filter-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap
}

.choice {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  min-height: 44px;
  font-size: 12px;
  background: #fff;
  display: flex;
  align-items: center;
  gap: 5px
}

.choice[aria-pressed=true] {
  border-color: var(--heritage);
  background: #fff1f3;
  color: var(--heritage)
}

.choice svg {
  width: 15px;
  height: 15px
}

.sheet-actions {
  position: sticky;
  bottom: 0;
  padding: 12px 20px 18px;
  background: #fff;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px
}

.sheet-actions .secondary {
  width: 96px
}

.sheet-actions .primary {
  flex: 1
}

.range-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted)
}

.sheet-content input[type=range] {
  width: 100%;
  accent-color: var(--heritage);
  height: 40px;
  cursor: pointer
}

.stepper {
  display: flex;
  padding: 0 20px 25px;
  gap: 0
}

.step {
  flex: 1;
  position: relative;
  text-align: center;
  color: var(--muted);
  font-size: 10px
}

.step::before {
  content: '';
  position: absolute;
  height: 2px;
  background: var(--line);
  width: 100%;
  top: 14px;
  left: -50%
}

.step:first-child::before {
  display: none
}

.step span {
  position: relative;
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  margin: 0 auto 6px;
  border-radius: 50%;
  background: var(--soft);
  z-index: 1;
  border: 1px solid var(--line);
  font-size: 11px
}

.step.active {
  color: var(--heritage);
  font-weight: 600
}

.step.active span {
  color: #fff;
  border-color: var(--heritage);
  background: var(--heritage)
}

.step.done span {
  background: var(--red-soft);
  color: var(--heritage);
  border-color: #f4c8d5
}

.mini-product {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--soft);
  border-radius: 16px;
  padding: 14px;
  margin: 0 20px 22px
}

.mini-product img {
  height: 64px;
  width: 62px;
  object-fit: contain;
  mix-blend-mode: multiply
}

.mini-product h3 {
  font-size: 13px;
  letter-spacing: -.25px
}

.mini-product p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px
}

.mini-product .price {
  font-size: 14px;
  margin-top: 4px
}

.form-area {
  padding: 0 20px 30px
}

.form-area h2 {
  font-size: 19px;
  margin-bottom: 8px
}

.form-area>p {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 20px
}

.field {
  margin-bottom: 18px
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 7px
}

.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid #d9d5cf;
  border-radius: 12px;
  background: #fff;
  min-height: 50px;
  padding: 12px;
  font-size: 16px;
  color: var(--ink)
}

.field textarea {
  resize: vertical;
  min-height: 76px
}

.field .hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px
}

.field .error {
  color: var(--heritage);
  font-size: 11px;
  margin-top: 5px;
  min-height: 0
}

.field.invalid input,
.field.invalid select {
  border-color: var(--heritage)
}

.form-info {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px;
  background: var(--soft);
  border-radius: 13px;
  font-size: 11px;
  color: var(--muted)
}

.form-info svg {
  width: 19px;
  color: var(--heritage);
  margin-top: 1px
}

.installation-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 13px;
  min-height: 69px;
  margin-bottom: 10px
}

.installation-choice[aria-pressed=true] {
  border-color: var(--heritage);
  background: #fff6f7
}

.installation-choice strong {
  display: block;
  font-size: 13px
}

.installation-choice small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px
}

.installation-choice svg {
  color: var(--heritage)
}

.review-block {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px
}

.review-heading {
  display: flex;
  justify-content: space-between;
  align-items: center
}

.review-heading h3 {
  font-size: 13px
}

.review-heading button {
  min-height: 44px;
  color: var(--heritage);
  font-size: 12px;
  padding: 0 6px
}

.review-block p {
  font-size: 12px;
  margin-top: 7px;
  overflow-wrap: anywhere;
  color: var(--muted)
}

.consent {
  display: flex;
  gap: 10px;
  font-size: 12px;
  line-height: 1.7;
  margin: 20px 0
}

.consent input {
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  accent-color: var(--heritage);
  flex-shrink: 0
}

.consent button {
  padding: 0;
  font-size: inherit;
  text-decoration: underline;
  color: var(--heritage)
}

.success {
  padding: 36px 24px
}

.success-burst {
  position: relative;
  border-radius: 50%;
  width: 88px;
  height: 88px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  background: var(--red-soft);
  color: var(--heritage)
}

.success-burst svg {
  height: 39px;
  width: 39px;
  stroke-width: 2
}

.success h1 {
  text-align: center;
  font-size: 25px;
  margin-bottom: 11px
}

.success>p {
  text-align: center;
  font-size: 13px;
  color: var(--muted)
}

.success .review-block {
  margin-top: 28px
}

.success .primary {
  margin-top: 20px
}

.request-ref {
  font-size: 11px;
  color: var(--heritage);
  text-align: center;
  margin-top: 16px
}

.packages-empty {
  padding-top: 50px
}

.package-card {
  margin: 0 20px 15px;
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden
}

.package-card .mini-product {
  margin: 0;
  border-radius: 0;
  background: #fff
}

.status-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--soft);
  font-size: 10px;
  color: var(--muted)
}

.status-strip strong {
  color: var(--heritage);
  font-size: 11px
}

.profile-box {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 24px 20px 22px
}

.avatar {
  width: 57px;
  height: 57px;
  background: var(--red-soft);
  color: var(--heritage);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: 600
}

.profile-box h1 {
  font-size: 21px
}

.profile-box p {
  font-size: 12px;
  color: var(--muted)
}

.menu-list {
  padding: 0 20px 22px
}

.menu-row {
  border-bottom: 1px solid var(--line);
  min-height: 64px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  font-size: 13px
}

.menu-row>svg:first-child {
  color: var(--heritage);
  width: 20px
}

.menu-row>svg:last-child {
  margin-left: auto;
  width: 16px;
  color: var(--muted)
}

.saved-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted)
}

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 100px;
  max-width: 410px;
  width: calc(100% - 48px);
  border-radius: 13px;
  background: #242424;
  color: #fff;
  z-index: 120;
  padding: 13px 16px;
  font-size: 12px;
  text-align: center;
  box-shadow: 0 8px 30px #0002
}

.toast[hidden] {
  display: none
}

.support-intro {
  background: var(--warm);
  margin: 0 20px 23px;
  padding: 23px;
  border-radius: 20px
}

.support-intro h2 {
  font-size: 24px;
  margin-bottom: 10px
}

.support-intro p {
  font-size: 13px;
  color: var(--muted)
}

.support-intro .secondary {
  background: transparent;
  margin-top: 20px;
  border-color: #bdb7ad;
  text-decoration: none
}

.help-card {
  margin: 0 20px 15px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 17px
}

.help-card h3 {
  margin-bottom: 8px
}

.help-card p {
  font-size: 12px;
  color: var(--muted)
}

.cart-row {
  margin: 0 20px 14px;
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 14px;
  position: relative
}

.cart-row .mini-product {
  margin: 0;
  padding: 0;
  background: #fff;
  padding-right: 28px
}

.cart-row>.icon-button {
  position: absolute;
  right: 2px;
  top: 2px;
  color: var(--muted)
}

.cart-row .secondary {
  margin-top: 12px;
  width: 100%
}

.request-small {

.consult-product-context h2,

.consultation-form>h2 {

.consultation-form>p {

.consultation-form .primary svg {

.consultation-form .primary[aria-busy=true] {

.consultation-form .hotline-link {

.consultation-form .consultation-note {

.consultation-form .consultation-demo-note {

.consultation-feedback {

.consultation-feedback.error,

.consultation-screen>.hotline-link {

.consultation-confirmation {

.consultation-confirmation .success-burst {

.consultation-confirmation>p {
  font-size: 14px;

  color: var(--muted);

.consultation-confirmation .request-ref {
  margin-top: 20px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--heritage);

.consultation-confirmation .consult-product-context {
  margin: 24px 0;

.consultation-confirmation .review-block {

  background: var(--soft);

.consultation-confirmation .review-block h2,
.consultation-confirmation .review-block h3 {
  font-size: 16px;
  line-height: 1.6;

.consultation-confirmation .review-block p {
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere
}

.consultation-confirmation .primary,
.consultation-confirmation .secondary {
  min-height: 52px;
  width: 100%;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  margin-top: 12px
}

.consultation-confirmation .hotline-link {
  margin-top: 16px
}

.consultation-confirmation .text-button {
  min-height: 48px;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 8px

@media(max-width:359px) {
  .product-card-actions .primary {

  }

  .consultation-panel .secondary {

  }

/* Tìm hiểu LG Subscribe + Gói của tôi (đang sử dụng) */
.learn-hero{position:relative;overflow:hidden;min-height:190px;margin:0 16px;padding:20px 18px 40px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#fd312e 0%,#d41f33 55%,#a50034 100%)}
.learn-hero .eyebrow{opacity:.9}
.learn-hero h2{font-size:27px;line-height:1.08;letter-spacing:-.7px;margin:8px 0 14px;font-weight:700}
.learn-hero-copy{position:relative;z-index:2;max-width:60%}
.learn-hero-tags{display:flex;flex-wrap:wrap;gap:6px}
.learn-hero-tags span{font-size:10px;font-weight:600;padding:5px 9px;border-radius:99px;background:#ffffff2b}
.learn-hero-art{position:absolute;right:14px;bottom:34px;width:38%;height:118px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:18px;padding:8px 4px}
.learn-hero-art img{width:50%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.learn-intro{position:relative;margin:-14px 28px 0;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px #0000001a;z-index:3}
.learn-intro p{font-size:12px;line-height:1.55;color:var(--muted);text-align:left}
.learn-intro .learn-lead{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.learn-list{display:grid;gap:10px;padding:18px 16px 4px}
.learn-row{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;padding:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px}
.learn-row:active{background:var(--soft)}
.learn-row>svg:last-child{margin-left:auto;width:16px;height:16px;color:var(--heritage)}
.learn-ico{width:44px;height:44px;border-radius:12px;background:var(--red-soft);color:var(--heritage);display:grid;place-items:center;flex:none}
.learn-copy{display:grid;gap:3px;min-width:0}
.learn-copy strong{font-size:14px;line-height:1.25}
.learn-copy small{font-size:11px;color:var(--muted);line-height:1.35}
.learn-cta{display:grid;gap:10px;margin-top:16px}
.learn-link{justify-content:center;width:100%;margin-top:6px}
.care-hero{margin:0 16px 18px;padding:20px 14px 14px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#fd312e 0%,#c4162a 60%,#a50034 100%)}
.care-hero .eyebrow{opacity:.9;padding:0 4px}
.care-hero h2{font-size:22px;line-height:1.15;letter-spacing:-.5px;margin:8px 4px 16px;max-width:90%}
.care-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.care-stat{background:#fff;color:var(--ink);border-radius:14px;padding:11px 9px 12px;display:grid;gap:3px;align-content:start}
.care-stat svg{width:18px;height:18px;color:var(--muted)}
.care-stat strong{font-size:20px;color:var(--heritage);letter-spacing:-.5px;margin-top:3px}
.care-stat span{font-size:10px;line-height:1.35;color:var(--muted)}
.step-list{list-style:none;margin:6px 20px 0;padding:0}
.step-list li{display:flex;gap:14px;position:relative;padding-bottom:22px}
.step-list li:not(:last-child)::before{content:'';position:absolute;left:15px;top:34px;bottom:2px;width:1px;background:var(--line)}
.step-no{width:31px;height:31px;border-radius:50%;background:var(--red-soft);color:var(--heritage);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.step-list h3{font-size:14px;margin-top:5px}
.step-list p{font-size:12px;line-height:1.5;color:var(--muted);margin-top:4px}
.demo-bar{margin:0 20px 14px;padding:10px 12px 12px;border:1px dashed #cfc9bf;border-radius:14px;background:var(--soft)}
.demo-bar>span{display:block;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.demo-chips{display:flex;flex-wrap:wrap;gap:6px}
.demo-chips button{font-size:11px;font-weight:500;padding:7px 11px;min-height:34px;border-radius:99px;border:1px solid var(--line);background:#fff}
.demo-chips button[aria-pressed=true]{background:var(--heritage);border-color:var(--heritage);color:#fff;font-weight:600}
.active-card .mini-product{margin:0}
.pay-block{padding:14px 14px 4px}
.pay-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.status-chip{font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px}
.status-chip.live{background:#fff3df;color:#9a5b00}
.status-chip.done{background:#e6f6ec;color:#17794a}
.pay-count{font-size:12px;font-weight:600}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--heritage);border-radius:99px}
.is-paid .progress span{background:#1f9d62}
.pay-meta{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;margin:14px 0 10px}
.pay-meta dt{font-size:10px;color:var(--muted)}
.pay-meta dd{font-size:13px;font-weight:700;margin:3px 0 0}
.pay-meta small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.pay-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;margin:12px 0 8px;color:#17794a}
.pay-note svg{width:18px;height:18px;margin-top:1px}
.care-block{margin:6px 14px 0;padding:12px 0 0;border-top:1px solid var(--line)}
.care-line{display:flex;gap:10px;align-items:flex-start}
.care-line svg{width:20px;height:20px;color:var(--heritage);margin-top:1px}
.care-line strong{display:block;font-size:12px}
.care-line span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.card-actions{display:grid;gap:8px;padding:14px}
.card-actions .primary,.card-actions .secondary{min-height:46px;font-size:13px}
.card-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-actions .row .secondary{font-size:12px;padding:10px 8px}
.learn-cta a.primary,.learn-cta a.secondary,.card-actions a{text-decoration:none}
.pay-list{list-style:none;margin:6px 0 0;padding:0}
.pay-list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.pay-dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.pay-dot svg{width:13px;height:13px;stroke-width:3;color:#fff}
.pay-list .paid .pay-dot{background:#1f9d62;border-color:#1f9d62}
.pay-list .next .pay-dot{border-color:var(--heritage);box-shadow:0 0 0 3px var(--red-soft)}
.pay-term{font-size:13px;font-weight:600}
.pay-term small,.pay-amount small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:2px}
.pay-amount{margin-left:auto;text-align:right;font-size:13px;font-weight:600}
.pay-list .later{opacity:.55}
.pay-list .next .pay-amount small{color:var(--heritage);font-weight:600}
@media (max-width:360px){.pay-meta{grid-template-columns:1fr 1fr}.care-stat strong{font-size:17px}.learn-hero h2{font-size:23px}}
.learn-acc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.learn-acc .learn-row{border:0;border-radius:0}
.learn-acc .learn-row>svg:last-child{transition:transform .35s ease}
.learn-acc.open .learn-row>svg:last-child{transform:rotate(90deg)}
.learn-acc.open{border-color:var(--heritage)}
.learn-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.learn-acc.open .learn-panel{grid-template-rows:1fr}
.learn-panel>.learn-panel-in{overflow:hidden;min-height:0}
.learn-panel-body{padding:2px 14px 16px}
.learn-panel-body .care-hero{margin:0 0 14px}
.learn-panel-body .service-card{margin:0 0 14px;box-shadow:none}
.learn-panel-body .step-list{padding:0;margin:0 0 14px}
.learn-panel-body .learn-cta{padding:0}
.learn-panel-body .accordion{margin:12px 0}
@media (prefers-reduced-motion:reduce){.learn-panel,.learn-acc .learn-row>svg:last-child{transition:none}}

/* iPhone frame: drawn in HTML/CSS, shown only on larger screens.
   On a real phone (or a short/narrow window) the frame disappears and the app fills the screen. */
.stage,.phone,.phone-screen{display:contents}
.statusbar,.island,.home-indicator{display:none}

@media (min-width:521px) and (min-height:560px){
  body{overflow:hidden}
  .stage{display:grid;place-items:center;height:100vh;overflow:hidden}
  .phone{display:block;position:relative;flex:none;width:390px;height:844px;background:#fff;border-radius:56px;overflow:hidden;
    transform:scale(var(--phone-scale,1));transform-origin:center;
    box-shadow:0 0 0 2px #5b5b60,0 0 0 11px #1b1b1e,0 0 0 13px #3b3b40,0 40px 90px #00000040}
  .phone-screen{display:block;position:absolute;top:54px;left:0;right:0;bottom:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
  .phone-screen::-webkit-scrollbar{display:none}
  .app{max-width:none;min-height:100%;box-shadow:none}
  .screen,.screen.has-dock{min-height:0}
  .statusbar{display:flex;align-items:center;justify-content:space-between;position:absolute;top:0;left:0;right:0;height:54px;padding:8px 34px 0 42px;background:#fff;color:#000;z-index:30;font:600 16.5px/1 var(--body);letter-spacing:-.2px;user-select:none;pointer-events:none}
  .sb-icons{display:flex;align-items:center;gap:6px}
  .sb-icons svg{width:18px;height:12px;fill:currentColor;stroke:none}
  .sb-icons svg.sb-wifi{width:17px;height:12px;fill:none;stroke:currentColor;stroke-width:1.9}
  .sb-icons svg.sb-wifi .dot{fill:currentColor;stroke:none}
  .batt{position:relative;width:26px;height:12.5px;border:1.2px solid #00000059;border-radius:4px;padding:1.4px;margin-left:2px}
  .batt i{display:block;width:82%;height:100%;border-radius:2px;background:#000}
  .batt::after{content:'';position:absolute;right:-3.6px;top:3.2px;width:2px;height:4.2px;border-radius:0 2px 2px 0;background:#00000059}
  .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:300;pointer-events:none}
  .home-indicator{display:block;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:140;pointer-events:none}
  .nav{padding-bottom:24px;min-height:92px}
  .dock{padding-bottom:28px}
  .sheet{max-height:86%;padding-bottom:24px}
  .toast{bottom:112px}
  .sheet-actions{padding-bottom:26px}
  .preview-ribbon{z-index:1}
}
</style>

    now.setHours(12, 0, 0, 0);
    const base = [
      {
        key: 'renting',
        id: 'washer',
        plan: 36,
        start: new Date(addMonths(now, -13).getTime() - 3 * DAY_MS),
        careUsed: 1,
      },
      {key: 'paid', id: 'fridge', plan: 36, start: addMonths(now, -38), careUsed: 3},
    ];
    return base
      .filter(c => state.demo === 'all' || state.demo === c.key)
      .map(c => {
        const due = i => addMonths(c.start, i),
          paid = Array.from({length: c.plan}, (_, i) => i).filter(i => due(i) <= now).length;
        return {
          ...c,
          due,
          paid,
          end: addMonths(c.start, c.plan),
          next: paid < c.plan ? due(paid) : null,
          daysToNext: paid < c.plan ? Math.ceil((due(paid) - now) / DAY_MS) : 0,
          careNext: addMonths(c.start, 12 * (c.careUsed + 1)),
        };
      });

      view =

          ? checkout(

  function validateConsultation() {
    const c = state.consultation;
    c.errors = {};
    if (!byId(c.productId)) c.errors.productId = 'Vui lòng chọn sản phẩm cần tư vấn.';
    if (c.name.trim().length < 2) c.errors.name = 'Vui lòng nhập họ và tên.';
    const phone = c.phone.replace(/[\s.()-]/g, '').replace(/^\+84/, '0');
    if (!/^0\d{9}$/.test(phone)) c.errors.phone = 'Nhập số 10 chữ số hoặc số bắt đầu bằng +84.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim()))
      c.errors.email = 'Vui lòng nhập email hợp lệ.';
    return !Object.keys(c.errors).length;
  }
  async function submitConsultation() {
    const c = state.consultation;
    if (c.submitting) return;
    if (!validateConsultation()) {
      refresh();
      const first = Object.keys(c.errors)[0];
      $('#consult-' + first)?.focus();
      return;
    }
    const p = byId(c.productId),
      record = {
        ref:
          'LG-TV-' +
          Date.now().toString(36).toUpperCase() +
          '-' +
          Math.random().toString(36).slice(2, 6).toUpperCase(),
        productId: p.id,
        model: p.model,
        name: c.name.trim(),
        phone: c.phone.replace(/[\s.()-]/g, '').replace(/^\+84/, '0'),
        email: c.email.trim(),
        createdAt: new Date().toISOString(),
        status: window.LG_CONSULTATION_ENDPOINT ? 'submitted' : 'local-demo',
      };
    c.submitting = true;
    refresh();
    try {
      if (window.LG_CONSULTATION_ENDPOINT) {
        const controller = new AbortController(),
          timeout = setTimeout(() => controller.abort(), 20000);
        try {
          const response = await fetch(window.LG_CONSULTATION_ENDPOINT, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(record),
            signal: controller.signal,
          });
          if (!response.ok) throw new Error('server');
        } finally {
          clearTimeout(timeout);
        }
      }
      const records = [record, ...state.consultations];
      try {
        localStorage.setItem('lgs-consultations-v1', JSON.stringify(records));
      } catch (error) {
        if (record.status === 'local-demo') throw new Error('storage');
      }
      state.consultations = records;
      c.success = record;
      c.errors = {};
      window.dispatchEvent(new CustomEvent('lg:consultation-created', {detail: {...record}}));
    } catch (error) {
      c.errors.submit =
        error.message === 'storage'
          ? 'Thiết bị chưa lưu được yêu cầu. Vui lòng thử lại hoặc gọi 1800 1503.'
          : 'Chưa gửi được yêu cầu. Thông tin vẫn được giữ lại; vui lòng thử lại hoặc gọi 1800 1503.';
    } finally {
      c.submitting = false;
      if (location.hash.startsWith('#/consult')) refresh();
    }
  }
  function consultationHistory() {
    openSheet(
      'Yêu cầu tư vấn của tôi',
      state.consultations.length
        ? state.consultations
            .map(
              r =>
                `<article class="review-block"><h3>${escape(byId(r.productId)?.name || r.model)}</h3><p>Model: <strong>${escape(r.model)}</strong><br>Mã yêu cầu: ${escape(r.ref)}<br>${r.status === 'submitted' ? 'Đã gửi đến hệ thống tư vấn' : 'Đã ghi nhận mẫu trên thiết bị'}</p><button class="text-button" data-go="/product/${r.productId}">Xem sản phẩm ${icon('arrow')}</button></article>`,
            )
            .join('')
        : `<div class="empty"><h2>Chưa có yêu cầu tư vấn</h2><p>Chọn sản phẩm và để lại thông tin để được hỗ trợ.</p><button class="primary" data-consult="">Đăng ký tư vấn</button>${hotline()}</div>`,
    );
  }

  function startPurchase(id, fromCard = false) {
    if (!byId(id) || byId(id).canRegister === false) {
      toast('Sản phẩm hiện chưa nhận đơn hàng');
      return;
    }
    if (fromCard) {
      const pref = state.productPreferences[id];
      state.plan = pref?.plan || 36;
      state.mode = pref?.mode || 'monthly';
      state.previous = location.hash;
    }
    state.errors = {};
    state.form.consent = false;
    state.scrolls['#/checkout/' + id + '?step=1'] = 0;
    go('/checkout/' + id + '?step=1');
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if(b.dataset.acc){const a=b.closest('.learn-acc'),o=!a.classList.contains('open');a.classList.toggle('open',o);b.setAttribute('aria-expanded',o);if(o)setTimeout(()=>a.scrollIntoView({behavior:'smooth',block:'nearest'}),420);return}
    if (b.dataset.go) {
      go(b.dataset.go);
      return;
    }
    if (b.dataset.product) {
      state.previous = location.hash;
      state.gallery = 0;
      go('/product/' + b.dataset.product);
      return;
    }
    if (b.dataset.category) {
      const next = b.dataset.category;
      if (next !== state.category) {
        state.filters = {budget: 'all', capacity: 'all', style: 'all', maxWidth: 'all'};
        state.query = '';
      }
      state.category = next;
      state.pendingFocus = '.category-switch';
      state.scrolls['#/products?category=' + next] = 0;
      go('/products?category=' + next);
      return;
    }
    if (b.dataset.save) {
      const id = b.dataset.save,
        selected = state.saved.includes(id);
      state.saved = selected ? state.saved.filter(x => x !== id) : [...state.saved, id];
      save();
      document.querySelectorAll('[data-save="' + id + '"]').forEach(el => {
        el.setAttribute('aria-pressed', !selected);
        el.setAttribute('aria-label', (!selected ? 'Bỏ lưu ' : 'Lưu ') + byId(id).name);
      });
      if (location.hash.startsWith('#/saved')) refresh();
      toast(selected ? 'Đã bỏ lưu sản phẩm' : 'Đã lưu trong Tài khoản → Sản phẩm đã lưu');
      return;
    }
    if (b.dataset.campaign !== undefined) {
      state.campaign = Number(b.dataset.campaign);
      $('#hero-slot').innerHTML = hero();
      document
        .querySelectorAll('[data-campaign]')
        .forEach(el =>
          el.setAttribute('aria-pressed', Number(el.dataset.campaign) === state.campaign),
        );
      return;
    }
    if (b.dataset.plan) {
      state.plan = Number(b.dataset.plan);
      refresh();
      return;
    }
    if (b.dataset.mode) {
      state.mode = b.dataset.mode;
      refresh();
      return;
    }
    if (b.dataset.gallery !== undefined) {
      state.gallery = Number(b.dataset.gallery);
      const p = byId(location.hash.split('/')[2]?.split('?')[0]);
      $('#detail-image').src = ASSETS[p.galleryKeys.filter(k => ASSETS[k])[state.gallery]];
      $('#detail-image').alt = p.name + ' — hình ' + (state.gallery + 1);
      document
        .querySelectorAll('[data-gallery]')
        .forEach(el =>
          el.setAttribute('aria-pressed', Number(el.dataset.gallery) === state.gallery),
        );
      return;
    }
    if (b.dataset.buy) {
      startPurchase(b.dataset.buy, b.dataset.cardBuy === 'true');
      return;
    }
    if (b.dataset.consult !== undefined) {
      startConsultation(b.dataset.consult);
      return;
    }
    if (b.dataset.addCart) {
      if (byId(b.dataset.addCart)?.canRegister === false) return;
      const entry = {id: b.dataset.addCart, plan: state.plan, mode: state.mode};
      state.cart = state.cart.filter(x => x.id !== entry.id);
      state.cart.push(entry);
      save();
      refresh();
      toast('Đã thêm sản phẩm và kỳ hạn vào giỏ hàng');
      return;
    }
    if (b.dataset.removeCart) {
      state.cart = state.cart.filter(x => x.id !== b.dataset.removeCart);
      save();
      refresh();
      return;
    }
    if (b.dataset.cartRegister) {
      const r = state.cart.find(x => x.id === b.dataset.cartRegister);
      state.plan = r.plan;
      state.mode = r.mode;
      startPurchase(r.id);
      return;
    }
    if (b.dataset.nextStep) {
      b.disabled = true;
      nextStep(byId(b.dataset.id), Number(b.dataset.nextStep));
      return;
    }
    if (b.dataset.installation) {
      state.form.installation = b.dataset.installation;
      refresh();
      return;
    }
    if (b.dataset.filterKey) {
      state.draft[b.dataset.filterKey] = b.dataset.filterValue;
      document
        .querySelectorAll('[data-filter-key="' + b.dataset.filterKey + '"]')
        .forEach(el =>
          el.setAttribute(
            'aria-pressed',
            el.dataset.filterValue === state.draft[b.dataset.filterKey],
          ),
        );
      $('#apply-filters').textContent = 'Xem ' + filtered(state.draft).length + ' sản phẩm';
      return;
    }
    if (b.dataset.removeFilter) {
      state.filters[b.dataset.removeFilter] = 'all';
      paintResults();
      return;
    }
    if (b.dataset.requestDetail) {
      const r = state.requests.find(x => x.ref === b.dataset.requestDetail),
        p = byId(r.id);
      openSheet(
        'Chi tiết đơn hàng mẫu',
        `<div class="answer"><h3>${escape(p.name)}</h3><p>Mã: ${escape(r.ref)}<br>${r.mode === 'monthly' ? 'Gói ' + r.plan + ' tháng<br>' + money(p.monthly[r.plan]) + '/tháng<br>Tổng ' + money(p.monthly[r.plan] * r.plan) : 'Mua một lần: ' + money(p.buyPrice)}</p><p>Trạng thái: đơn hàng mẫu được lưu trên thiết bị. Chưa có hợp đồng, lịch giao lắp hoặc thanh toán thực tế.</p></div>`,
      );
      return;
    }
    if (b.dataset.demo) {
      state.demo = b.dataset.demo;
      refresh();
      return;
    }
    if (b.dataset.schedule) {
      scheduleSheet(b.dataset.schedule);
      return;
    }
    const action = b.dataset.action;
    if (action === 'category-picker') categorySheet();
    else if (action === 'close-sheet') closeSheet();
    else if (action === 'filter') filterSheet();
    else if (action === 'search') {
      state.category = 'all';
      state.query = '';
      state.filters = {budget: 'all', capacity: 'all', style: 'all', maxWidth: 'all'};
      go('/products');
      setTimeout(() => $('#product-search')?.focus(), 80);
    } else if (action === 'clear-filters') {
      state.filters = {budget: 'all', capacity: 'all', style: 'all', maxWidth: 'all'};
      state.query = '';
      refresh();
    } else if (action === 'apply-filters') {
      state.filters = {...state.draft};
      closeSheet();
      paintResults();
    } else if (action === 'reset-draft') {
      state.draft = {budget: 'all', capacity: 'all', style: 'all', maxWidth: 'all'};
      document
        .querySelectorAll('[data-filter-key]')
        .forEach(el => el.setAttribute('aria-pressed', el.dataset.filterValue === 'all'));
      $('#apply-filters').textContent = 'Xem ' + filtered(state.draft).length + ' sản phẩm';
    } else if (action === 'more')
      openSheet(
        'LG Subscribe',
        `<button class="menu-row" data-go="/support">${icon('chat')}Hỏi đáp & hỗ trợ${icon('chevron')}</button><button class="menu-row" data-action="about">${icon('info')}Về LG Subscribe${icon('chevron')}</button><button class="menu-row" data-action="privacy">${icon('shield')}Quyền riêng tư${icon('chevron')}</button>`,
      );
    else if (action === 'about' || action === 'campaign-info') go('/learn');
    else if (action === 'about-legacy')
      openSheet(
        'Tiện nghi theo cách của bạn',
        `<div class="answer"><h3>Chọn sản phẩm. Chọn gói.</h3><p>LG Subscribe giúp bạn khám phá các sản phẩm LG và lựa chọn kỳ hạn thanh toán phù hợp. Dịch vụ chăm sóc, điều kiện và giá cuối cùng được xác nhận khi đăng ký.</p><h3>Khám phá ngay trong MiniApp</h3><p>Chọn loại sản phẩm, lọc theo giá và kích thước, xem tổng chi phí, rồi mua sản phẩm. Hoặc để lại thông tin tại phần tư vấn riêng.</p><p>Banner và giá trong bản xem trước dùng để minh họa thiết kế.</p></div><button class="primary" data-go="/products">Khám phá sản phẩm ${icon('arrow')}</button>`,
      );
    else if (action === 'privacy')
      openSheet(
        'Cách sử dụng thông tin',
        `<div class="answer"><p>Thông tin người mua được dùng để xác nhận đơn hàng và nhu cầu giao lắp. Khi gửi yêu cầu tư vấn, họ tên, số điện thoại, email và mã model giúp nhân viên liên hệ đúng nhu cầu.</p><p>Bản demo chưa cấu hình API: yêu cầu tư vấn gồm thông tin liên hệ và model được lưu trên thiết bị. Thông tin người mua ở form mua hàng chỉ tồn tại khi trang đang mở; đơn hàng mẫu lưu mã sản phẩm và lựa chọn gói.</p><p>Chính sách quyền riêng tư và đơn vị xử lý dữ liệu cần được xác nhận trước khi đưa MiniApp vào sử dụng.</p></div>`,
      );
    else if (action === 'active-packages')
      openSheet(
        'Gói đang sử dụng',
        `<div class="empty" style="padding:12px 0 8px"><div class="empty-icon">${icon('package')}</div><h2>Bạn chưa có gói đang sử dụng</h2><p>Gói đã kích hoạt sẽ xuất hiện tại đây cùng lịch thanh toán và chăm sóc.</p><button class="primary" data-go="/products">Chọn sản phẩm</button></div>`,
      );
    else if (action === 'ask-advice') startConsultation('');
    else if (action === 'consultation-history') consultationHistory();
  });
  document.addEventListener('input', e => {
    if (e.target.dataset.consultField) {
      const key = e.target.dataset.consultField;
      state.consultation[key] = e.target.value;
      delete state.consultation.errors[key];
      const error = $('#consult-error-' + key);
      if (error) error.textContent = '';
      e.target.closest('.field')?.classList.remove('invalid');
      e.target.removeAttribute('aria-invalid');
    }
    if (e.target.id === 'product-search') {
      state.query = e.target.value;
      paintResults();
    }
    if (e.target.dataset.form) {
      state.form[e.target.dataset.form] =
        e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      if (state.errors[e.target.dataset.form]) {
        delete state.errors[e.target.dataset.form];
        const er = $('#error-' + e.target.dataset.form);
        if (er) er.textContent = '';
        e.target.closest('.field')?.classList.remove('invalid');
        e.target.removeAttribute('aria-invalid');
      }
    }
  });
  document.addEventListener('change', e => {
    if (e.target.dataset.consultField === 'productId') {
      state.consultation.productId = e.target.value;
      state.consultation.errors = {};
      refresh();
    }
    if (e.target.id === 'product-sort') {
      state.sort = e.target.value;
      paintResults();
    }
    if (e.target.dataset.form === 'invoice') {
      state.form.invoice = e.target.checked;
      refresh();
    }
    if (e.target.dataset.form === 'city') {
      refresh();
    }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'consultation-form') {
      e.preventDefault();
      submitConsultation();
    }
  });
  $('#sheet-root').addEventListener('click', e => {
    if (e.target.id === 'sheet-root') closeSheet();
  });
  document.addEventListener('keydown', e => {
    if ($('#sheet-root').hidden) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeSheet();
    }
    if (e.key === 'Tab') {
      const f = [
          ...$('#sheet-root').querySelectorAll('button,a,input,select,textarea,[tabindex="0"]'),
        ].filter(x => !x.disabled && !x.hidden),
        first = f[0],
        last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });
  let touchX = 0;
  document.addEventListener(
    'touchstart',
    e => {
      if (e.target.closest('.hero')) touchX = e.touches[0].clientX;
    },
    {passive: true},
  );
  document.addEventListener(
    'touchend',
    e => {
      if (!e.target.closest('.hero')) return;
      const delta = e.changedTouches[0].clientX - touchX;
      if (Math.abs(delta) > 45) {
        state.campaign = (state.campaign + (delta < 0 ? 1 : 2)) % 3;
        $('#hero-slot').innerHTML = hero();
        document
          .querySelectorAll('[data-campaign]')
          .forEach(el =>
            el.setAttribute('aria-pressed', Number(el.dataset.campaign) === state.campaign),
          );
      }
    },
    {passive: true},
  );
  window.addEventListener('hashchange', () => render());
  const clock = () => {
    const d = new Date(),
      t = $('#sb-time');
    if (t) t.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  };
  clock();
  setInterval(clock, 15000);
  const fit = () => {
    const ph = $('#phone');
    if (ph)
      ph.style.setProperty(
        '--phone-scale',
        Math.max(0.5, Math.min(1, (innerHeight - 56) / 844, (innerWidth - 56) / 390)),
      );
  };
  fit();
  window.addEventListener('resize', fit);
  if (!location.hash) location.hash = window.LG_DEFAULT_ROUTE || '/home';
  else render();
})();
</script>
</body>
</html>
